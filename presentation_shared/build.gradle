apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.pimenta.bestv.presentation'
    buildFeatures {
        buildConfig = true
        compose true
    }
    defaultConfig {
        buildConfigField "String", "PREFERENCE_NAME", "\"BESTV\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

dependencies {
    implementation project(':model_shared')

    // Kotlin
    implementation libs.kotlin.stdlib

    // Koin
    implementation libs.koin.core
    implementation libs.koin.android.runtime

    // AndroidX
    implementation libs.androidx.recommendation
    implementation libs.androidx.tvprovider

    // Lottie
    implementation libs.lottie.compose

    // Compose for TV
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp
    debugImplementation libs.compose.ui.tooling.runtime

    // Compose UI Testing (instrumented tests)
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    debugImplementation libs.compose.ui.test.manifest
}
