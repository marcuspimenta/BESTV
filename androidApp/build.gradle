import groovy.json.JsonOutput

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def tmdbAccessToken = System.getenv('TMDB_ACCESS_TOKEN')
if (tmdbAccessToken == null || tmdbAccessToken.trim().isEmpty()) {
    tmdbAccessToken = localProperties.getProperty('TMDB_ACCESS_TOKEN')
}
if (tmdbAccessToken == null) {
    tmdbAccessToken = ''
}

if (tmdbAccessToken.trim().isEmpty()) {
    logger.warn('''
        TMDB_ACCESS_TOKEN is not set. BESTV will build, but TMDb API requests will not authenticate.
        Set TMDB_ACCESS_TOKEN in the environment, or add it to the root local.properties file.
    '''.stripIndent().trim())
}

def tmdbAccessTokenLiteral = JsonOutput.toJson(tmdbAccessToken.trim())

android {
    namespace 'com.pimenta.bestv'
    buildFeatures {
        compose true
        buildConfig true
    }
    defaultConfig {
        applicationId "com.pimenta.bestv"
        versionCode 2
        versionName "1.1.0"
        buildConfigField "String", "TMDB_ACCESS_TOKEN", tmdbAccessTokenLiteral
    }
    buildTypes {
        debug {
            debuggable true
            multiDexEnabled true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':appComposition')
    implementation project(':common')
    implementation project(':feature_workdetail')
    implementation project(':feature_castdetail')
    implementation project(':feature_search')
    implementation project(':feature_recommendation')
    implementation project(':feature_workbrowse')

    // Kotlin
    implementation libs.kotlin.stdlib

    // AndroidX
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.navigation3.runtime
    implementation libs.navigation3.ui
    implementation libs.lifecycle.viewmodel.navigation3
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.androidx.work.runtime.ktx

    // Koin
    implementation libs.koin.android.runtime
    implementation libs.koin.android.compose
    implementation libs.koin.workmanager

    // Timber
    implementation libs.timber

    // Tests
    testImplementation libs.junit4
}

tasks.register('verifyNavigationEntries') {
    group = 'verification'
    description = 'Verifies that every navigation destination has a registered entry provider.'
    dependsOn tasks.named('testDebugUnitTest')
}

tasks.named('check') {
    dependsOn tasks.named('verifyNavigationEntries')
}

tasks.matching {
    it.name in ['assembleDebug', 'assembleRelease', 'bundleDebug', 'bundleRelease']
}.configureEach {
    dependsOn tasks.named('verifyNavigationEntries')
}
