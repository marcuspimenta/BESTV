apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.kotlin.multiplatform.library'
apply plugin: 'app.cash.sqldelight'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

kotlin {
    android {
        namespace = 'com.pimenta.bestv.data'
        compileSdk = libs.versions.compile.sdk.get().replace('android-', '').split('\\.')[0].toInteger()
        minSdk = libs.versions.min.sdk.get().toInteger()
        compilerOptions.jvmTarget.set(
            org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(libs.versions.jvm.target.get())
        )
    }

    iosArm64()
    iosSimulatorArm64()
    iosX64()

    sourceSets {
        commonMain.dependencies {
            api libs.kotlinx.coroutines.core
            api libs.sqldelight.runtime
            implementation libs.sqldelight.coroutines.extensions
        }

        androidMain.dependencies {
            implementation libs.sqldelight.android.driver
        }

        iosMain.dependencies {
            implementation libs.sqldelight.native.driver
        }
    }
}

sqldelight {
    databases {
        MediaDatabase {
            packageName = 'com.pimenta.bestv.data.local.database'
            dialect libs.sqldelight.sqlite318.dialect
        }
    }
}
