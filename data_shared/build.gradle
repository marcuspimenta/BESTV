apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

def tmdbApiKey = System.getenv('TMDB_API_KEY')
if (tmdbApiKey == null || tmdbApiKey.trim().isEmpty()) {
    def localPropertiesFile = rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        def localProperties = new Properties()
        localPropertiesFile.withInputStream { localProperties.load(it) }
        tmdbApiKey = localProperties.getProperty('TMDB_API_KEY')
    }
}

if (tmdbApiKey == null || tmdbApiKey.trim().isEmpty()) {
    throw new GradleException('''
        TMDB_API_KEY is required to build BESTV.
        Set TMDB_API_KEY in the environment, or add TMDB_API_KEY=<your key> to the root local.properties file.
        For CI, expose the TMDB_API_KEY secret as an environment variable for the Gradle build.
    '''.stripIndent().trim())
}

def tmdbApiKeyLiteral = groovy.json.JsonOutput.toJson(tmdbApiKey.trim())

android {
    namespace 'com.pimenta.bestv.data'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField "String", "TMDB_BASE_URL", "\"https://api.themoviedb.org/3/\""
        buildConfigField "String", "TMDB_FILTER_LANGUAGE", "\"en-US\""
    }
    buildTypes {
        debug {
            buildConfigField "String", "TMDB_API_KEY", tmdbApiKeyLiteral
        }
        release {
            buildConfigField "String", "TMDB_API_KEY", tmdbApiKeyLiteral
        }
    }
}

dependencies {
    implementation project(':model_shared')

    // Kotlin
    implementation Libs.kotlin

    // Koin
    implementation Libs.koin_core
    implementation Libs.koin_android

    // Room components
    api Libs.androidx_room
    kapt Libs.androidx_room_compiler
    implementation Libs.androidx_room_ktx

    // Retrofit
    implementation Libs.retrofit
    implementation Libs.retrofit_converter_gson

    // OkHttp
    implementation Libs.okhttp
    implementation Libs.logging_interceptor

    // Gson
    implementation Libs.gson
}
