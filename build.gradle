import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath libs.plugin.android.gradle
        classpath libs.plugin.kotlin.gradle
        classpath libs.plugin.compose.compiler.gradle
        classpath libs.plugin.kotlin.serialization.gradle
        classpath libs.plugin.ktlint.gradle
        classpath libs.plugin.android.legacy.kapt
    }
}

def configureAndroidProject = { project ->
    project.apply plugin: 'kotlin-parcelize'

    project.configure(project.extensions.getByName('android')) {
        compileSdkVersion libs.versions.compile.sdk.get()

        defaultConfig {
            minSdkVersion libs.versions.min.sdk.get().toInteger()
            targetSdkVersion libs.versions.target.sdk.get().toInteger()
        }

        compileOptions {
            sourceCompatibility JavaVersion.toVersion(libs.versions.java.version.get())
            targetCompatibility JavaVersion.toVersion(libs.versions.java.version.get())
        }
    }

    project.configure(project.extensions.getByName('kotlin')) {
        compilerOptions {
            jvmTarget.set(JvmTarget.fromTarget(libs.versions.jvm.target.get()))
        }
    }
}

subprojects { project ->
    project.pluginManager.withPlugin('com.android.application') {
        configureAndroidProject(project)
    }
    project.pluginManager.withPlugin('com.android.library') {
        configureAndroidProject(project)
    }
    project.pluginManager.withPlugin('org.jlleitschuh.gradle.ktlint') {
        project.configure(project.extensions.getByName('ktlint')) {
            outputToConsole = true
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
    dependsOn subprojects.collect { subproject ->
        subproject.tasks.matching { task -> task.name == 'clean' }
    }
}

tasks.register('formatKotlin') {
    group = 'formatting'
    description = 'Formats Kotlin source across all modules with ktlint.'
    dependsOn subprojects.collect { subproject ->
        subproject.tasks.matching { task -> task.name == 'ktlintFormat' }
    }
}

apply from: rootProject.file('gradle/verify-architecture.gradle')
