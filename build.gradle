import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath libs.plugin.android.gradle
        classpath libs.plugin.kotlin.gradle
        classpath libs.plugin.compose.compiler.gradle
        classpath libs.plugin.ktlint.gradle
        classpath libs.plugin.android.legacy.kapt
    }
}

def configureAndroidProject = { project ->
    project.apply plugin: 'kotlin-parcelize'

    project.configure(project.extensions.getByName('android')) {
        compileSdkVersion libs.versions.compile.sdk.get()

        defaultConfig {
            minSdkVersion libs.versions.min.sdk.get().toInteger()
            targetSdkVersion libs.versions.target.sdk.get().toInteger()
        }

        compileOptions {
            sourceCompatibility JavaVersion.toVersion(libs.versions.java.version.get())
            targetCompatibility JavaVersion.toVersion(libs.versions.java.version.get())
        }
    }

    project.configure(project.extensions.getByName('kotlin')) {
        compilerOptions {
            jvmTarget.set(JvmTarget.fromTarget(libs.versions.jvm.target.get()))
        }
    }
}

subprojects { project ->
    project.pluginManager.withPlugin('com.android.application') {
        configureAndroidProject(project)
    }
    project.pluginManager.withPlugin('com.android.library') {
        configureAndroidProject(project)
    }
    project.pluginManager.withPlugin('org.jlleitschuh.gradle.ktlint') {
        project.configure(project.extensions.getByName('ktlint')) {
            outputToConsole = true
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
    dependsOn subprojects.collect { subproject ->
        subproject.tasks.matching { task -> task.name == 'clean' }
    }
}

tasks.register('formatKotlin') {
    group = 'formatting'
    description = 'Formats Kotlin source across all modules with ktlint.'
    dependsOn subprojects.collect { subproject ->
        subproject.tasks.matching { task -> task.name == 'ktlintFormat' }
    }
}

tasks.register('verifyArchitecture') {
    group = 'verification'
    description = 'Checks production Kotlin imports against feature layer boundaries.'
    doLast {
        def featureNames = subprojects.findAll { it.name.startsWith('feature_') }
            .collect { it.name.substring('feature_'.length()) }
        def violations = []
        subprojects.each { module ->
            def sourceRoot = module.file('src/main/java')
            if (!sourceRoot.exists()) return
            fileTree(sourceRoot).matching { include '**/*.kt' }.each { sourceFile ->
                def relativePath = sourceFile.path.substring(sourceRoot.path.length()).replace('\\', '/')
                def inDomain = relativePath.contains('/domain/')
                def inData = relativePath.contains('/data/')
                def inSharedPresentation = module.name == 'model_shared' && relativePath.contains('/presentation/')
                sourceFile.eachLine { line, lineNumber ->
                    def matcher = line =~ /^\s*import\s+([^\s]+)/
                    if (!matcher.find()) return
                    def imported = matcher.group(1)
                    def isPresentation = imported.contains('.presentation.') ||
                        imported.startsWith('com.pimenta.bestv.presentation.')
                    def isData = imported.contains('.data.') || imported.startsWith('com.pimenta.bestv.data.')
                    def foreignFeature = featureNames.any { feature ->
                        module.name != "feature_${feature}" && imported.startsWith("com.pimenta.bestv.${feature}.")
                    }
                    if ((inDomain && (isPresentation || isData || imported.startsWith('android.') ||
                        imported.startsWith('androidx.') || imported.startsWith('retrofit2.') ||
                        imported.startsWith('org.koin.'))) ||
                        (inData && isPresentation) ||
                        (inSharedPresentation && isData) ||
                        (module.name.startsWith('feature_') && foreignFeature)) {
                        violations << "${module.name}${relativePath}:${lineNumber}: ${line.trim()}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Architecture import violations:\n${violations.join('\n')}")
        }
    }
}

project(':app').tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn rootProject.tasks.named('verifyArchitecture')
}
