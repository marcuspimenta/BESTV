apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def tmdbAccessToken = System.getenv('TMDB_ACCESS_TOKEN')
if (tmdbAccessToken == null || tmdbAccessToken.trim().isEmpty()) {
    tmdbAccessToken = localProperties.getProperty('TMDB_ACCESS_TOKEN')
}
if (tmdbAccessToken == null) {
    tmdbAccessToken = ''
}

if (tmdbAccessToken.trim().isEmpty()) {
    logger.warn('''
        TMDB_ACCESS_TOKEN is not set. BESTV will build, but TMDb API requests will not authenticate.
        Set TMDB_ACCESS_TOKEN in the environment, or add it to the root local.properties file.
    '''.stripIndent().trim())
}

def tmdbAccessTokenLiteral = groovy.json.JsonOutput.toJson(tmdbAccessToken.trim())

android {
    namespace 'com.pimenta.bestv.common'

    buildFeatures {
        buildConfig = true
        compose true
    }

    defaultConfig {
        buildConfigField "String", "TMDB_BASE_URL", "\"https://api.themoviedb.org/3/\""
        buildConfigField "String", "TMDB_FILTER_LANGUAGE", "\"en-US\""
        buildConfigField "String", "YOUTUBE_BASE_URL", "\"https://www.youtube.com/watch?v=%s\""
        buildConfigField "String", "YOUTUBE_THUMBNAIL_BASE_URL", "\"https://img.youtube.com/vi/%s/hqdefault.jpg\""
        buildConfigField "String", "PREFERENCE_NAME", "\"BESTV\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            buildConfigField "String", "TMDB_ACCESS_TOKEN", tmdbAccessTokenLiteral
        }
        release {
            buildConfigField "String", "TMDB_ACCESS_TOKEN", tmdbAccessTokenLiteral
        }
    }

    testOptions {
        unitTests.all {
            jvmArgs '-Dnet.bytebuddy.experimental=true'
        }
    }
}

dependencies {
    // Shared Ktor client configuration and wire models used by feature modules.
    implementation libs.ktor.client.core
    implementation libs.ktor.client.content.negotiation
    implementation libs.ktor.serialization.kotlinx.json
    implementation libs.ktor.client.logging
    implementation libs.ktor.client.okhttp
    implementation libs.okhttp.client
    // Kotlin and coroutines
    implementation libs.kotlin.stdlib
    api libs.kotlinx.coroutines.core

    // Serialization
    implementation libs.kotlinx.serialization.core

    // Koin
    implementation libs.koin.core
    implementation libs.koin.android.runtime

    // Room
    api libs.androidx.room.runtime
    implementation libs.androidx.room.ktx
    kapt libs.androidx.room.compiler
    // Keep Room's metadata reader aligned with the Kotlin compiler version.
    kapt libs.kotlin.metadata.jvm

    // Networking

    // Android platform integrations
    implementation libs.androidx.recommendation
    implementation libs.androidx.tvprovider

    // Compose, image loading, and animation
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp
    implementation libs.lottie.compose
    debugImplementation libs.compose.ui.tooling.runtime

    // Navigation contracts exposed to consuming features
    api libs.navigation3.runtime

    // Unit tests
    testImplementation libs.junit4
    testImplementation libs.kotlin.test.junit
    testImplementation libs.robolectric
    testImplementation libs.ktor.client.mock
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.kotlinx.serialization.json
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin

    // Compose UI instrumentation tests
    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    debugImplementation libs.compose.ui.test.manifest
}
