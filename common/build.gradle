import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'org.jetbrains.kotlin.multiplatform'
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'app.cash.sqldelight'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

compose.resources {
    publicResClass = true
    packageOfResClass = 'com.pimenta.bestv.common.resources'
}

kotlin {
    androidTarget {
        compilerOptions.jvmTarget.set(JvmTarget.fromTarget(libs.versions.jvm.target.get()))
    }

    iosArm64()
    iosSimulatorArm64()

    sourceSets {
        matching { it.name == 'androidAndroidTV' }.configureEach {
            kotlin.srcDir("src/androidTV/kotlin")
        }
        commonMain.dependencies {
            api libs.kotlinx.coroutines.core
            api libs.sqldelight.runtime
            api libs.kotlinx.serialization.core
            api libs.koin.core
            api libs.navigation3.runtime
            api libs.androidx.lifecycle.viewmodel
            api libs.androidx.lifecycle.runtime.compose
            api libs.koin.compose
            api libs.koin.compose.viewmodel
            api compose.runtime
            api compose.foundation
            api compose.material3
            implementation compose.materialIconsExtended
            api compose.ui
            implementation compose.components.resources
            implementation libs.coil.compose
            implementation libs.coil.network.ktor3
            implementation libs.kotlinx.serialization.json
            implementation libs.sqldelight.coroutines.extensions

            implementation libs.ktor.client.core
            implementation libs.ktor.client.content.negotiation
            implementation libs.ktor.client.logging
            implementation libs.ktor.serialization.kotlinx.json
        }

        androidMain.dependencies {
            api libs.ktor.client.core

            implementation libs.sqldelight.android.driver
            implementation libs.ktor.client.okhttp
            implementation libs.okhttp.client

            implementation libs.koin.android.runtime


            implementation libs.compose.ui.tooling.preview
            implementation libs.androidx.activity.compose
            implementation libs.androidx.lifecycle.runtime.ktx
            implementation libs.coil.network.okhttp
            implementation libs.timber
        }

        androidUnitTest.dependencies {
            implementation libs.junit4
            implementation libs.kotlin.test.junit
            implementation libs.robolectric
            implementation libs.ktor.client.mock
            implementation libs.kotlinx.coroutines.test
            implementation libs.kotlinx.serialization.json
            implementation libs.mockito.inline
            implementation libs.mockito.core
            implementation libs.mockito.kotlin
        }

        androidInstrumentedTest.dependencies {
            implementation project.dependencies.platform(libs.compose.bom)
            implementation libs.compose.ui.test.junit4
            implementation libs.androidx.test.ext.junit
            implementation libs.compose.ui.test.manifest
        }
    }
}

sqldelight {
    databases {
        MediaDatabase {
            packageName = 'com.pimenta.bestv.data.local.database'
            dialect libs.sqldelight.sqlite318.dialect
        }
    }
}

android {
    namespace 'com.pimenta.bestv.common'
    buildFeatures { compose true }
    testOptions { unitTests.includeAndroidResources = true }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
}

dependencies {
    androidTVImplementation libs.androidx.tv.foundation
    androidTVImplementation libs.androidx.tv.material
    androidTVImplementation libs.lottie.compose
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.ext.junit
    debugImplementation libs.compose.ui.test.manifest
}
