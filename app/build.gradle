apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.pimenta.bestv'
    buildFeatures {
        compose true
    }
    defaultConfig {
        applicationId "com.pimenta.bestv"
        versionCode 2
        versionName "1.1.0"
    }
    buildTypes {
        debug {
            debuggable true
            multiDexEnabled true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':feature_workdetail')
    implementation project(':feature_castdetail')
    implementation project(':feature_search')
    implementation project(':feature_recommendation')
    implementation project(':feature_workbrowse')
    implementation project(':model_shared')
    implementation project(':data_shared')
    implementation project(':presentation_shared')
    implementation project(':route_shared')

    // Kotlin
    implementation libs.kotlin.stdlib

    // AndroidX
    implementation libs.androidx.activity.ktx
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.navigation3.runtime
    implementation libs.navigation3.ui
    implementation libs.lifecycle.viewmodel.navigation3
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.androidx.work.runtime.ktx

    // Retrofit
    implementation libs.retrofit.core

    // Koin
    implementation libs.koin.android.runtime
    implementation libs.koin.android.compose
    implementation libs.koin.workmanager

    // Timber
    implementation libs.timber

    // Tests
    testImplementation libs.junit4
}

tasks.register('verifyNavigationEntries') {
    group = 'verification'
    description = 'Verifies that every navigation destination has a registered entry provider.'
    dependsOn tasks.named('testDebugUnitTest')
}

tasks.named('check') {
    dependsOn tasks.named('verifyNavigationEntries')
}

tasks.matching {
    it.name in ['assembleDebug', 'assembleRelease', 'bundleDebug', 'bundleRelease']
}.configureEach {
    dependsOn tasks.named('verifyNavigationEntries')
}
