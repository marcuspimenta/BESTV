apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.pimenta.bestv.castdetail'

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation project(':model_shared')
    implementation project(':presentation_shared')
    implementation project(':route_shared')

    // Kotlin
    implementation libs.kotlin.stdlib

    // Compose for TV
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui.core
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.androidx.tv.foundation
    implementation libs.androidx.tv.material
    implementation libs.androidx.activity.compose
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp
    debugImplementation libs.compose.ui.tooling.runtime


    // Koin
    implementation libs.koin.android.runtime
    implementation libs.koin.android.compose

    // Retrofit
    implementation libs.retrofit.core

    // Timber
    implementation libs.timber

    // JUnit
    testImplementation libs.junit4

    // Coroutines Test
    testImplementation libs.kotlinx.coroutines.test

    // Turbine (for testing flows)
    testImplementation libs.turbine

    // Kotlin Test
    testImplementation libs.kotlin.test.junit

    // Mockito
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin

    // Robolectric
    testImplementation libs.robolectric
}
