apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.pimenta.bestv.model'
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        buildConfigField "String", "YOUTUBE_BASE_URL", "\"https://www.youtube.com/watch?v=%s\""
        buildConfigField "String", "YOUTUBE_THUMBNAIL_BASE_URL", "\"https://img.youtube.com/vi/%s/hqdefault.jpg\""
    }
}

dependencies {
    implementation libs.kotlinx.serialization.core
    // Kotlin
    implementation libs.kotlin.stdlib

    // Coroutines exposed by shared extensions
    api libs.kotlinx.coroutines.core

    // Room components
    implementation libs.androidx.room.runtime

    // Gson
    implementation libs.gson

    // JUnit
    testImplementation libs.junit4

    // Coroutines Test
    testImplementation libs.kotlinx.coroutines.test
}
