name: Dependabot platform builds

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: dependabot-platform-builds-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    name: Android mobile and TV
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.1

      - name: Build Android mobile and TV apps
        run: ./gradlew :androidApp:assembleAndroidMobileDebug :androidApp:assembleAndroidTVDebug

  ios:
    name: iOS simulator
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK for Gradle configuration
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.1

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -derivedDataPath "$RUNNER_TEMP/BESTVDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
