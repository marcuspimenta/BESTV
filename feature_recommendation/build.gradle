apply plugin: 'com.android.library'
apply plugin: 'org.jlleitschuh.gradle.ktlint'

android {
    namespace 'com.pimenta.bestv.recommendation'
}

dependencies {
    implementation project(':model_shared')
    implementation project(':presentation_shared')
    implementation project(':route_shared')

    // Kotlin
    implementation libs.kotlin.stdlib

    // AndroidX
    implementation libs.androidx.core
    implementation libs.androidx.recommendation
    implementation libs.androidx.tvprovider
    implementation libs.androidx.work.runtime.ktx

    // Coil
    implementation libs.coil.compose
    implementation libs.coil.network.okhttp

    // Coroutines
    implementation libs.kotlinx.coroutines.core
    implementation libs.kotlinx.coroutines.android


    // Koin
    implementation libs.koin.android.runtime

    // Retrofit
    implementation libs.retrofit.core

    // Timber
    implementation libs.timber

    // JUnit
    testImplementation libs.junit4

    // Coroutines Test
    testImplementation libs.kotlinx.coroutines.test

    // Mockito
    testImplementation libs.mockito.inline
    testImplementation libs.mockito.core
    testImplementation libs.mockito.kotlin
    testImplementation libs.robolectric
}
